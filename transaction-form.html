<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="form-style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <script src="scriptacademic.js" defer></script>
    <title>Bauer-Academic-Request</title>
  </head>
  <body>
    <main class="page-container">
      <section>
        <h2>Appointment Details</h2>

        <form method="get" id="transaction-form.html">
          <fieldset>
            <legend>Advising Information</legend>
            <div class="form-row">
              <div class="form-group">
                <label for="studentName">Student Name</label>
                <input
                  id="studentName"
                  name="studentName"
                  type="text"
                  required
                />
              </div>

              <div class="form-group">
                <label for="psid">PSID</label>
                <input
                  id="psid"
                  name="psid"
                  type="text"
                  inputmode="numeric"
                  pattern="[0-9]{7}"
                  maxlength="7"
                  required
                />
                <p id="validstudentId" aria-live="polite"></p>
              </div>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label for="studentMajor">Student Major</label>
                <select id="studentMajor" name="studentMajor" required>
                  <option value="">Select your major</option>
                  <option value="accounting">Accounting</option>
                  <option value="finance">Finance</option>
                  <option value="management">Management</option>
                  <option value="marketing">Marketing</option>
                  <option value="entrepreneurship">Entrepreneurship</option>
                  <option value="managementInformationSystem">
                    Management Information System
                  </option>
                  <option value="supplyChainManagement">
                    Supply Chain Management
                  </option>
                </select>
              </div>

              <div class="form-group">
                <label for="gradTerm">Graduation Term</label>
                <select id="gradTerm" name="gradTerm" required>
                  <option value="">Select your graduation term</option>
                  <option value="spring">Spring</option>
                  <option value="summer">Summer</option>
                  <option value="fall">Fall</option>
                </select>
              </div>

              <div class="form-group">
                <label for="gradYear">Graduation Year</label>
                <select id="gradYear" name="gradYear" required>
                  <option value="">Select your graduation year</option>
                  <option value="2026">2026</option>
                  <option value="2027">2027</option>
                  <option value="2028">2028</option>
                  <option value="2029">2029</option>
                  <option value="2030">2030</option>
                </select>
              </div>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label for="appointmentType">Appointment Type</label>
                <select id="appointmentType" name="appointmentType" required>
                  <option value="">Select an appointment type</option>
                  <option value="virtual">Virtual</option>
                  <option value="in-person">In-Person</option>
                </select>
              </div>
            </div>

            <div class="form-group">
              <label for="description">Appointment Purpose / Description</label>
              <textarea
                id="description"
                name="description"
                rows="4"
                cols="45"
                required
              ></textarea>
            </div>
          </fieldset>

          <button type="submit">Submit Request</button>
        </form>
      </section>
    </main>
  </body>
</html>
